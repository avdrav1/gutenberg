[package]
name = "gutenberg-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gutenberg-core.workspace = true
gutenberg-store.workspace = true
gutenberg-theme.workspace = true
iced.workspace = true
ego-tree.workspace = true
scraper.workspace = true
url.workspace = true
iced_test = { version = "0.14", optional = true }

[features]
# Headless screenshots of the window: examples/theme_shots.rs per theme,
# examples/site_media.rs for the site's screenshots and trailer frames.
shots = ["dep:iced_test"]

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true

[[bench]]
name = "list_view"
harness = false

[[example]]
name = "theme_shots"
required-features = ["shots"]

[[example]]
name = "site_media"
required-features = ["shots"]
