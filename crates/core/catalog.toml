# Gutenberg's starter catalog: what the Add sources screen offers.
#
# Curated for trust (editorial standards and corrections, original reporting
# or primary sources, known ownership; balanced where politics is involved)
# and for ease (a public feed, no login, no key). Every feed was fetched on
# 2026-10-21 with Gutenberg's User-Agent: HTTP 200, a parseable RSS, Atom,
# RDF or JSON feed, a newest item under 60 days old, at most 300 items.
# Recheck before a release: cargo run -p gutenberg-core --example check_catalog
#
# Rules the tests enforce: 8 to 12 feeds per category; unique https URLs;
# titles up to 40 characters, blurbs up to 70; exactly 12 starter feeds,
# all free. Keyword presets and MCP servers show greyed out until keyword
# alerts (S5.1) and MCP sources (S6.2) can add them.

