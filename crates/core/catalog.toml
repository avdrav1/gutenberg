# ── MCP servers (addable from S6.2) ──
[[mcp]]
title = "Brave Search – News"
blurb = "News search from Brave's independent web index"
transport = "stdio"
command = "npx"
args = ["-y", "@brave/brave-search-mcp-server", "--transport", "stdio"]
tool = "brave_news_search"
arguments = '{"query": "world news", "country": "US", "search_lang": "en", "count": 20, "freshness": "pd"}'
secret = "BRAVE_API_KEY"
homepage = "https://github.com/brave/brave-search-mcp-server"
maintainer = "Brave Software (official)"

[[mcp]]
title = "Tavily – News Search"
blurb = "Web and news search with time filters, built for agents"
transport = "stdio"
command = "npx"
args = ["-y", "tavily-mcp@latest"]
tool = "tavily_search"
arguments = '{"query": "Federal Reserve interest rates", "topic": "news", "time_range": "day", "max_results": 20}'
secret = "TAVILY_API_KEY"
homepage = "https://github.com/tavily-ai/tavily-mcp"
maintainer = "Tavily (official)"

[[mcp]]
title = "SEC EDGAR – Recent Filings"
blurb = "Latest 8-K and other SEC filings, with links to EDGAR"
transport = "stdio"
command = "uvx"
args = ["sec-edgar-mcp"]
tool = "get_recent_filings"
arguments = '{"form_type": "8-K", "days": 1, "limit": 40}'
secret = "SEC_EDGAR_USER_AGENT"
homepage = "https://github.com/stefanoamorelli/sec-edgar-mcp"
maintainer = "Stefano Amorelli (community; not affiliated with the SEC)"

[[mcp]]
title = "Exa – News Search"
blurb = "Neural web search, filtered to news, no key needed"
transport = "http"
url = "https://mcp.exa.ai/mcp"
tool = "web_search_exa"
arguments = '{"query": "category:news consumer technology product launch", "numResults": 20}'
homepage = "https://github.com/exa-labs/exa-mcp-server"
maintainer = "Exa Labs (official)"

[[mcp]]
title = "Jina AI – Web Search"
blurb = "Web search with age filter, returning titles, URLs and snippets"
transport = "http"
url = "https://mcp.jina.ai/v1"
tool = "search_web"
arguments = '{"query": "NASA mission", "num": 10, "tbs": "qdr:d"}'
secret = "JINA_API_KEY"
homepage = "https://github.com/jina-ai/MCP"
maintainer = "Jina AI (official)"

[[mcp]]
title = "Firecrawl – News Search"
blurb = "Web and news search from Firecrawl, keyless free tier"
transport = "http"
url = "https://mcp.firecrawl.dev/v2/mcp"
tool = "firecrawl_search"
arguments = '{"query": "heatwave drought wildfire", "sources": ["news"], "limit": 20, "lang": "en", "country": "us"}'
homepage = "https://github.com/firecrawl/firecrawl-mcp-server"
maintainer = "Firecrawl (official)"

[[mcp]]
title = "GitHub – Repo Releases"
blurb = "Latest releases of any GitHub repository"
transport = "http"
url = "https://api.githubcopilot.com/mcp/"
tool = "list_releases"
arguments = '{"owner": "rust-lang", "repo": "rust", "perPage": 10}'
secret = "GITHUB_PERSONAL_ACCESS_TOKEN"
homepage = "https://github.com/github/github-mcp-server"
maintainer = "GitHub (official)"

[[mcp]]
title = "arXiv – Latest Papers"
blurb = "Newest arXiv preprints by query and category"
transport = "stdio"
command = "uvx"
args = ["arxiv-mcp-server"]
tool = "search_papers"
arguments = '{"query": "\"large language models\"", "categories": ["cs.CL", "cs.LG", "cs.AI"], "sort_by": "date", "max_results": 30, "abstract_mode": "snippet"}'
homepage = "https://github.com/blazickjp/arxiv-mcp-server"
maintainer = "blazickjp (community; listed in official MCP registry)"

[[mcp]]
title = "Hugging Face – Daily Papers"
blurb = "Today's Hugging Face Daily Papers picks for ML research"
transport = "http"
url = "https://huggingface.co/mcp"
tool = "hf_fs"
arguments = '{"operations": [{"op": "ls", "uri": "hf://papers/daily/latest", "limit": 30}]}'
homepage = "https://github.com/huggingface/hf-mcp-server"
maintainer = "Hugging Face (official)"

[[mcp]]
title = "PubMed – New Clinical Trials"
blurb = "Newest PubMed records for a query, NCBI E-utilities"
transport = "stdio"
command = "npx"
args = ["-y", "@cyanheads/pubmed-mcp-server"]
tool = "pubmed_search_articles"
arguments = '{"query": "randomized controlled trial[pt]", "maxResults": 20, "summaryCount": 20, "sort": "pub_date"}'
homepage = "https://github.com/cyanheads/pubmed-mcp-server"
maintainer = "Casey Hand / cyanheads (community)"

[[mcp]]
title = "Fetch – Any Page as Markdown"
blurb = "Reads a web page with no feed as Markdown so its links become items"
transport = "stdio"
command = "uvx"
args = ["mcp-server-fetch", "--user-agent=Gutenberg/0.2 (+https://github.com/avdrav1/gutenberg)"]
tool = "fetch"
arguments = '{"url": "https://www.kernel.org/", "max_length": 20000}'
homepage = "https://github.com/modelcontextprotocol/servers/tree/main/src/fetch"
maintainer = "Model Context Protocol project (official reference server)"
