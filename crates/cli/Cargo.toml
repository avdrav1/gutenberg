[package]
name = "gutenberg-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gutenberg-core.workspace = true
gutenberg-sources.workspace = true
gutenberg-store.workspace = true
gutenberg-theme.workspace = true
gutenberg-ui.workspace = true
tokio.workspace = true
# Typing a key at a terminal without it showing.
nix = { version = "0.31", default-features = false, features = ["term"] }

[[bin]]
name = "gutenberg"
path = "src/main.rs"

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
