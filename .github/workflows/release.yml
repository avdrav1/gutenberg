name: Release

# A v* tag builds both targets, publishes a GitHub release with
# SHA256SUMS and build attestations, and deploys site/ to GitHub Pages.
# A pull request that touches any of this runs the same build and an
# install.sh test against the fresh tarballs, and publishes nothing.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - site/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable
      - name: Build
        run: cargo auditable build --release --locked -p gutenberg-cli
      - name: Package
        run: |
          mkdir -p dist/gutenberg
          cp target/release/gutenberg dist/gutenberg/
          strip dist/gutenberg/gutenberg
          cp LICENSE CHANGELOG.md dist/gutenberg/
          dist/gutenberg/gutenberg --version
          tar -C dist -czf "gutenberg-${{ matrix.target }}.tar.gz" gutenberg
      - uses: actions/upload-artifact@v4
        with:
          name: gutenberg-${{ matrix.target }}
          path: gutenberg-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # install.sh against the tarballs just built, served from localhost.
  install-test:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install with install.sh
        run: |
          (cd dist && sha256sum gutenberg-*.tar.gz > SHA256SUMS && cat SHA256SUMS)
          (cd dist && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 1
          GUTENBERG_BASE_URL=http://127.0.0.1:8000 GUTENBERG_INSTALL_DIR="$RUNNER_TEMP/bin" sh site/install.sh
          "$RUNNER_TEMP/bin/gutenberg" --version
      - name: A tampered tarball is refused
        run: |
          printf 'tampered' >> dist/gutenberg-x86_64-unknown-linux-gnu.tar.gz
          (cd dist && python3 -m http.server 8001 >/dev/null 2>&1 &)
          sleep 1
          if GUTENBERG_BASE_URL=http://127.0.0.1:8001 GUTENBERG_INSTALL_DIR="$RUNNER_TEMP/bin2" sh site/install.sh; then
            echo "::error::install.sh accepted a tarball that does not match SHA256SUMS"
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/bin2/gutenberg"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, install-test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum gutenberg-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/gutenberg-*.tar.gz
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          printf '\nInstall: `curl -fsSL https://avdrav1.github.io/gutenberg/install.sh | sh`\n' >> notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/gutenberg-*.tar.gz dist/SHA256SUMS \
            --title "Gutenberg ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
