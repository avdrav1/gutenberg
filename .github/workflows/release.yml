name: Release

# A v* tag builds the two Linux and two macOS targets, publishes a GitHub
# release with SHA256SUMS and build attestations, and deploys site/ to the
# Cloudflare Worker behind gutenbergapp.com and to GitHub Pages (the old
# avdrav1.github.io address). A pull request that touches any of this runs
# the same build, an install.sh test against the fresh tarballs on Ubuntu
# and on macOS, and a launch of the window on stock Ubuntu under Xvfb, and
# publishes nothing.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/macos/**
      - site/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      # A Mac leg that fails (a brew flake, a runner label gone) must not
      # cancel the Linux legs: they finish and upload, and the run shows
      # which target broke.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          # Each Mac builds for itself, so no cross-compiling. If GitHub
          # retires the Intel label, drop this target rather than hold a
          # release on it.
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable
      - name: Build
        run: cargo auditable build --release --locked -p gutenberg-cli
      - name: Package
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/gutenberg
          cp target/release/gutenberg dist/gutenberg/
          strip dist/gutenberg/gutenberg
          cp LICENSE CHANGELOG.md dist/gutenberg/
          # The desktop entry, icon and Omarchy bar widget install.sh adds.
          cp -r share dist/gutenberg/
          dist/gutenberg/gutenberg --version
          tar -C dist -czf "gutenberg-${{ matrix.target }}.tar.gz" gutenberg
      # The tarball with the bare binary (no share/: nothing in it applies
      # to a Mac) and Gutenberg.app, zipped, both signed ad hoc. The icon is
      # rendered from share/'s SVG, which needs librsvg.
      - name: Package for macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install librsvg
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          bash .github/macos/bundle.sh target/release/gutenberg "${{ matrix.target }}" "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: gutenberg-${{ matrix.target }}
          path: |
            gutenberg-${{ matrix.target }}.tar.gz
            Gutenberg-${{ matrix.target }}.zip
          if-no-files-found: error

  # install.sh against the tarballs just built, served from localhost.
  install-test:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gutenberg-*-linux-gnu
          path: dist
          merge-multiple: true
      - name: Install with install.sh
        run: |
          (cd dist && sha256sum gutenberg-*.tar.gz > SHA256SUMS && cat SHA256SUMS)
          (cd dist && python3 -m http.server 8000 --bind 127.0.0.1 </dev/null >/dev/null 2>&1 &)
          sleep 1
          GUTENBERG_BASE_URL=http://127.0.0.1:8000 GUTENBERG_INSTALL_DIR="$RUNNER_TEMP/bin" sh site/install.sh
          "$RUNNER_TEMP/bin/gutenberg" --version
          # No ~/.config/omarchy on the runner: no hooks, no bar widget.
          test ! -e "$HOME/.config/omarchy/hooks"
          test ! -e "$HOME/.config/omarchy/plugins"
          # Launchers list it, by the binary's full path.
          entry="$HOME/.local/share/applications/gutenberg.desktop"
          cat "$entry"
          grep -Fx "Exec=$RUNNER_TEMP/bin/gutenberg" "$entry"
          grep -Fx "TryExec=$RUNNER_TEMP/bin/gutenberg" "$entry"
          test -s "$HOME/.local/share/icons/hicolor/scalable/apps/gutenberg.svg"
          # No store yet: nothing unread, and no store made to say so.
          test "$("$RUNNER_TEMP/bin/gutenberg" --unread)" = 0
          test ! -e "$HOME/.local/share/gutenberg/gutenberg.db"
      - name: On Omarchy, install.sh adds hooks that reload the theme
        run: |
          home="$RUNNER_TEMP/omarchy-home"
          mkdir -p "$home/.config/omarchy"
          (cd dist && python3 -m http.server 8002 --bind 127.0.0.1 </dev/null >/dev/null 2>&1 &)
          sleep 1
          HOME="$home" GUTENBERG_BASE_URL=http://127.0.0.1:8002 GUTENBERG_INSTALL_DIR="$RUNNER_TEMP/it's bin" sh site/install.sh
          for name in theme-set font-set; do
            hook="$home/.config/omarchy/hooks/$name.d/gutenberg"
            test -x "$hook"
            cat "$hook"
            # With no window open the hook succeeds quietly.
            test -z "$(bash "$hook" 2>&1)"
          done
          grep -F "'$RUNNER_TEMP/it'\\''s bin/gutenberg' --reload-theme" "$home/.config/omarchy/hooks/theme-set.d/gutenberg"
          # The bar widget, pointed at the binary; a path with a space is
          # quoted in the desktop entry.
          widget="$home/.config/omarchy/plugins/gutenberg.unread"
          test -s "$widget/manifest.json" && test -s "$widget/i18n/en.json"
          grep -F "\"$RUNNER_TEMP/it's bin/gutenberg\"" "$widget/Unread.qml"
          ! grep -F "@GUTENBERG@" "$widget/Unread.qml"
          grep -Fx "Exec=\"$RUNNER_TEMP/it's bin/gutenberg\"" "$home/.local/share/applications/gutenberg.desktop"
      - name: A tampered tarball is refused
        run: |
          printf 'tampered' >> dist/gutenberg-x86_64-unknown-linux-gnu.tar.gz
          (cd dist && python3 -m http.server 8001 --bind 127.0.0.1 </dev/null >/dev/null 2>&1 &)
          sleep 1
          if GUTENBERG_BASE_URL=http://127.0.0.1:8001 GUTENBERG_INSTALL_DIR="$RUNNER_TEMP/bin2" sh site/install.sh; then
            echo "::error::install.sh accepted a tarball that does not match SHA256SUMS"
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/bin2/gutenberg"

  # The same on a Mac: the binary to a directory, Gutenberg.app to
  # ~/Applications, and nothing of the Linux desktop.
  install-test-macos:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gutenberg-*-apple-darwin
          path: dist
          merge-multiple: true
      - name: Install with install.sh
        run: |
          (cd dist && shasum -a 256 gutenberg-*.tar.gz Gutenberg-*.zip > SHA256SUMS && cat SHA256SUMS)
          (cd dist && python3 -m http.server 8000 --bind 127.0.0.1 </dev/null >/dev/null 2>&1 &)
          sleep 1
          GUTENBERG_BASE_URL=http://127.0.0.1:8000 GUTENBERG_INSTALL_DIR="$RUNNER_TEMP/bin" sh site/install.sh
          "$RUNNER_TEMP/bin/gutenberg" --version
          app="$HOME/Applications/Gutenberg.app"
          "$app/Contents/MacOS/gutenberg" --version
          # The bundle arrived whole, with its signature.
          codesign --verify --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          test -s "$app/Contents/Resources/gutenberg.icns"
          test ! -e "$HOME/Applications/.Gutenberg.app.new"
          # Nothing of the Linux desktop: no entry, no hooks, no widget.
          test ! -e "$HOME/.local/share/applications/gutenberg.desktop"
          test ! -e "$HOME/.config/omarchy"
          # No store yet: nothing unread, and no store made to say so.
          test "$("$RUNNER_TEMP/bin/gutenberg" --unread)" = 0
          test ! -e "$HOME/Library/Application Support/gutenberg/gutenberg.db"
      - name: An empty GUTENBERG_APP_DIR installs the binary alone
        run: |
          home="$RUNNER_TEMP/no-app-home"
          mkdir -p "$home"
          (cd dist && python3 -m http.server 8002 --bind 127.0.0.1 </dev/null >/dev/null 2>&1 &)
          sleep 1
          HOME="$home" GUTENBERG_APP_DIR= GUTENBERG_BASE_URL=http://127.0.0.1:8002 GUTENBERG_INSTALL_DIR="$RUNNER_TEMP/bin3" sh site/install.sh
          "$RUNNER_TEMP/bin3/gutenberg" --version
          test ! -e "$home/Applications"
      - name: A tampered tarball or app is refused
        run: |
          printf 'tampered' >> dist/gutenberg-aarch64-apple-darwin.tar.gz
          (cd dist && python3 -m http.server 8001 --bind 127.0.0.1 </dev/null >/dev/null 2>&1 &)
          sleep 1
          if GUTENBERG_BASE_URL=http://127.0.0.1:8001 GUTENBERG_INSTALL_DIR="$RUNNER_TEMP/bin2" sh site/install.sh; then
            echo "::error::install.sh accepted a tarball that does not match SHA256SUMS"
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/bin2/gutenberg"
          # SHA256SUMS agreeing with the tarball again and the zip tampered
          # instead: the binary installs, the app is refused.
          (cd dist && shasum -a 256 gutenberg-aarch64-apple-darwin.tar.gz Gutenberg-aarch64-apple-darwin.zip > SHA256SUMS)
          printf 'tampered' >> dist/Gutenberg-aarch64-apple-darwin.zip
          home="$RUNNER_TEMP/tampered-home"
          mkdir -p "$home"
          if HOME="$home" GUTENBERG_BASE_URL=http://127.0.0.1:8001 GUTENBERG_INSTALL_DIR="$RUNNER_TEMP/bin4" sh site/install.sh; then
            echo "::error::install.sh accepted a Gutenberg.app that does not match SHA256SUMS"
            exit 1
          fi
          test -x "$RUNNER_TEMP/bin4/gutenberg"
          test ! -e "$home/Applications/Gutenberg.app"

  launch-test:
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gutenberg-x86_64-unknown-linux-gnu
          path: dist
      - name: A stock Ubuntu desktop's packages, with software rendering
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            xvfb x11-apps imagemagick dbus dbus-x11 xdg-desktop-portal xdg-desktop-portal-gtk \
            libvulkan1 mesa-vulkan-drivers libegl1 libgl1-mesa-dri \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libx11-xcb1 libxcursor1 libxi6 libxrandr2 \
            fontconfig fonts-dejavu-core
      - name: The window opens, draws and answers on its socket
        run: |
          tar -xzf dist/gutenberg-x86_64-unknown-linux-gnu.tar.gz -C dist
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &
          sleep 2
          DISPLAY=:99 dbus-run-session -- bash .github/launch-test.sh dist/gutenberg/gutenberg launch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-test
          path: launch
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, install-test, install-test-macos, launch-test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum gutenberg-*.tar.gz Gutenberg-*.zip > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/gutenberg-*.tar.gz
            dist/Gutenberg-*.zip
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          printf '\nInstall: `curl -fsSL https://gutenbergapp.com/install.sh | sh`\n' >> notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/gutenberg-*.tar.gz dist/Gutenberg-*.zip dist/SHA256SUMS \
            --title "Gutenberg ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  # gutenbergapp.com is the Worker in wrangler.jsonc. Secrets: CLOUDFLARE_API_TOKEN
  # (the "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
  cloudflare:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
