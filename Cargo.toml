[workspace]
resolver = "2"
members = ["crates/core", "crates/store", "crates/sources", "crates/theme", "crates/ui", "crates/cli"]

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/avdrav1/gutenberg"

[workspace.dependencies]
gutenberg-core = { path = "crates/core" }
gutenberg-store = { path = "crates/store" }
gutenberg-sources = { path = "crates/sources" }
gutenberg-theme = { path = "crates/theme" }
gutenberg-ui = { path = "crates/ui" }

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json"] }
feed-rs = "3"
# Same version feed-rs pulls in; OPML is read and written with it directly.
quick-xml = "0.42"
# The bundled SQLite is compiled with FTS5; there is no separate feature.
rusqlite = { version = "0.32", features = ["bundled"] }
rmcp = { version = "3", features = ["client", "transport-child-process", "transport-streamable-http-client"] }
# wgpu (Vulkan) holds 60 fps scrolling 10k rows at 4K; tiny-skia managed
# ~10 fps there (S3.1). Vulkan setup costs ~170 ms of cold start, hence the
# 250 ms budget. tiny-skia stays as the fallback for machines without a GPU.
# linux-theme-detection reads the desktop's light or dark preference (the
# XDG portal), which picks the built-in theme when Omarchy has none (S4.4).
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "wayland", "x11", "tokio", "image", "svg", "advanced", "linux-theme-detection"] }
serde = { version = "1", features = ["derive"] }
# A source's kind-specific settings (`source.config`), such as a keyword query.
serde_json = "1"
toml = "0.8"
notify = "6"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
directories = "5"
html-escape = "0.2"
# html5ever behind a tree we can walk; article summaries are real-world HTML.
scraper = { version = "0.29", default-features = false }
# scraper's tree type, for walking it node by node.
ego-tree = "0.11"
# Readability.js ported to Rust: a web page down to its article (reader view).
dom_smoothie = "0.18"
url = "2"
futures = "0.3"
tempfile = "3"
criterion = "0.8"

# SQLite built at -O0 is several times slower, so debug timings would measure
# the build, not the query. Optimize it even in dev and test builds.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
