[workspace]
resolver = "2"
members = ["crates/core", "crates/store", "crates/sources", "crates/theme", "crates/ui", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/avdrav1/gutenberg"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json"] }
feed-rs = "2"
rusqlite = { version = "0.32", features = ["bundled", "fts5"] }
rmcp = { version = "3", features = ["client", "transport-child-process", "transport-streamable-http-client"] }
iced = { version = "0.13", features = ["tokio", "image", "svg", "advanced"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
notify = "6"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
directories = "5"
